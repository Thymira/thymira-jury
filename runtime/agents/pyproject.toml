[project]
name = "thymira-agents"
version = "0.1.0"
description = "Individual agents implemented with PydanticAI (Data, Coding/Execution, Experiment, Methodology, Risk, Regulatory) plus the LLM provider and the model router."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "thymira-schemas",
    "thymira-events",
    "thymira-observability",
    "thymira-policies",
    "thymira-tools",
    "pydantic-ai-slim>=2,<3",
    "litellm>=1.90,<2",
    "pyyaml>=6,<7",
]

[tool.uv.sources]
thymira-observability = { workspace = true }
thymira-schemas = { workspace = true }
thymira-events = { workspace = true }
thymira-policies = { workspace = true }
thymira-tools = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "thymira.agents"
namespace = true
