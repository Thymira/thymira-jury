[project]
name = "thymira-state"
version = "0.1.0"
description = "MVP local JSON/JSONL Run evidence and a local ArtifactStore; events are authoritative and projections are reconstructible."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "thymira-schemas",
    "thymira-events",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
]

[tool.uv.sources]
thymira-schemas = { workspace = true }
thymira-events = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "thymira.state"
namespace = true
