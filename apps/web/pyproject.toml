[project]
name = "thymira-web"
version = "0.1.0"
description = "The Thymira web console — a local browser client of the Thymira API (runs, plan, agents, approvals, tools, artifacts, audit, events, usage)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "starlette>=1.0,<2",
    "uvicorn>=0.30,<1",
]

[project.scripts]
thymira-web = "thymira.web.server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "thymira.web"
namespace = true
