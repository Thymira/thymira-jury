extends: default

rules:
  line-length:
    max: 120
    allow-non-breakable-words: true
    level: warning
  document-start: disable
  truthy:
    check-keys: false   # GitHub Actions uses `on:` as a key
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: 2
    indent-sequences: consistent

ignore: |
  .venv/
  runs/
  .pytest-tmp*/
  .pytest_tmp*/
