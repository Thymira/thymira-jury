[project]
name = "thymira-schemas"
version = "0.1.0"
description = "Typed contracts shared by every component, including Contract v0.4 MIRA records."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "thymira.schemas"
namespace = true
