version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: "build"
    groups:
      # One PR for every compatible bump; majors stay individual so they get a real review.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # ty is pre-1.0 and re-baselined by hand in the same commit (see the `ty` skill).
      - dependency-name: ty

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    commit-message:
      prefix: "build(docker)"
