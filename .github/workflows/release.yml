name: Release

# Tag vX.Y.Z (after the CONTRIBUTING release checklist) -> wheels for every member attached to
# a GitHub release with generated notes. Nothing is published to PyPI yet.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: build and verify the wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache in a release build: a poisoned cache must never reach a published artefact.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - run: uv sync --locked --all-groups --all-packages
      - run: uv run pytest -p no:cacheprovider
      - run: uv build --all-packages
      # The tag gates the member wheels that are actually published, not the non-publishing
      # virtual-root package's version. check_wheel.py holds every member wheel's version
      # against the tag (and still checks each wheel ships its runtime resources).
      - name: Every member wheel's version must match the tag
        run: uv run python scripts/check_wheel.py --expect-version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          retention-days: 30

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Create the release with the wheels and sdists attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
